name: Release

# Push a tag such as v0.1.0 to build, sign and publish the APK.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BUBBLE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing secret BUBBLE_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bubble.jks"

      - name: Build the release APK
        env:
          BUBBLE_VERSION: ${{ github.ref_name }}
          BUBBLE_KEYSTORE: ${{ runner.temp }}/bubble.jks
          BUBBLE_KEYSTORE_PASSWORD: ${{ secrets.BUBBLE_KEYSTORE_PASSWORD }}
          BUBBLE_KEY_ALIAS: ${{ secrets.BUBBLE_KEY_ALIAS }}
          BUBBLE_KEY_PASSWORD: ${{ secrets.BUBBLE_KEY_PASSWORD }}
        run: |
          export BUBBLE_VERSION="${BUBBLE_VERSION#v}"
          ./gradlew --no-daemon :bubble-app:assembleRelease

      - name: Verify the signature and prepare the files
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="bubble-$VERSION.apk"
          cp bubble-app/build/outputs/apk/release/bubble-app-release.apk "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | tee certificate.txt
          sha256sum "$APK" > "$APK.sha256"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Install \`$APK\` on the phone, then follow the [manual](https://riberojuanca.github.io/bubble-android/manual/en/)."
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "$APK.sha256")\`"
            echo
            echo "Signing certificate:"
            echo '```'
            grep -E "SHA-256 digest" certificate.txt
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --title "Bubble ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes
